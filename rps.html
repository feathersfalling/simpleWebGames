<!DOCTYPE html>
<html>
<head>
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.rps.css">
	<script src="rps.js" defer></script>
</head>
<body>
    <h1>✊ Rock, Paper, Scissors ✋</h1>
    <div class="choices">
        <button onclick="play('rock')">✊ Rock</button>
        <button onclick="play('scissors')">✌️ Paper</button>
        <button onclick="play('paper')">✋ Scissors</button>
    </div>
    <div class="result" id="result"></div>
    <div class="score" id="score">Score: Player 0 - 0 Computer</div>
</body>

</html>
