<!DOCTYPE html>
<html>
<head>
    <title>Угадай число</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #242124 }
        input, button { padding: 10px; font-size: 16px; margin: 5px; }
        .message { font-size: 18px; margin-top: 20px; font-weight: bold; color: #fff }
		h1 { color: #fff }
    </style>
</head>
<body>
    <h1>🎲 Угадай число от 1 до 100</h1>
    <input type="number" id="guessInput" placeholder="Твоё число" min="1" max="100">
    <button onclick="checkGuess()">Проверить</button>
    <button onclick="newGame()">Новая игра</button>
    <div class="message" id="message"></div>

    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const guess = Number(document.getElementById('guessInput').value);
            const messageDiv = document.getElementById('message');
            attempts++;

            if (!guess) {
                messageDiv.textContent = 'Введи число!';
                return;
            }

            if (guess === secretNumber) {
                messageDiv.textContent = `🎉 Поздравляю! Ты угадал число ${secretNumber} за ${attempts} попыток!`;
            } else if (guess > secretNumber) {
                messageDiv.textContent = '📈 Перелёт! Моё число меньше.';
            } else {
                messageDiv.textContent = '📉 Недолёт! Моё число больше.';
            }
        }

        function newGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            document.getElementById('message').textContent = 'Новая игра! Введи число.';
            document.getElementById('guessInput').value = '';
        }
    </script>
</body>
</html>
